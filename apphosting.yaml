# Firebase App Hosting backend settings.
#
# App Hosting builds this repo with `npm run build` and serves it with Next's
# own server on Cloud Run — plain Node, not the Workers runtime. Until the data
# layer moves to Firestore, what it serves is the D1-backed site with no D1:
# the storefront renders its "awaiting asset" slots (getLiveFilingSafe() returns
# null), and every page that needs the database errors.
runConfig:
  # Scale to zero when idle, and cap scale-out. App Hosting needs the Blaze
  # plan, which bills per use, and the default ceiling is far above what a
  # small drop shop needs — a runaway client should hit this, not the bill.
  minInstances: 0
  maxInstances: 2
